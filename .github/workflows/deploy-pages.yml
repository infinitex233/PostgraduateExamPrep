name: Deploy study dashboard

on:
  push:
    branches:
      - main
    paths:
      - StudyProgress/**
      - scripts/build_dashboard.py
      - scripts/build_dashboard_variants.py
      - scripts/test_build_dashboard.py
      - scripts/test_build_dashboard_variants.py
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dashboard dependency
        run: python -m pip install pyyaml

      - name: Test dashboard builders
        run: python -m unittest scripts.test_build_dashboard scripts.test_build_dashboard_variants

      - name: Build dashboard
        run: python scripts/build_dashboard.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp StudyProgress/dashboard.html _site/index.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
